<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhimsyOS — Expressive3MD Environment</title>
    <style>
        :root {
            --bg: #07080a;
            --surface: #12151c;
            --surface-hover: #181d28;
            --primary: #9d4edd;
            --primary-glow: rgba(157, 78, 221, 0.35);
            --accent: #c77dff;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(157, 78, 221, 0.4);
            --radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 1200px;
            background-image: 
                radial-gradient(circle at 20% 15%, rgba(157, 78, 221, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 30%, rgba(67, 97, 238, 0.1) 0%, transparent 40%),
                linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100% 1200px, 100% 1200px, 60px 60px, 60px 60px;
            z-index: -1;
            pointer-events: none;
        }

        /* Header */
        header {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1200px;
            height: 64px;
            background: rgba(18, 21, 28, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .logo {
            font-size: 1.2rem; /* Базовый размер для текста */
            font-weight: 800;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        /* Стилизация SVG-иконки логотипа */
        .logo svg {
            height: 1.4rem; /* Высота иконки относительно текста */
            width: auto;
            fill: var(--primary); /* Основной фиолетовый цвет */
            filter: drop-shadow(0 0 8px var(--primary-glow)); /* Неоновое свечение */
            transition: all 0.3s ease;
        }

        .logo:hover svg {
            filter: drop-shadow(0 0 12px var(--accent)); /* Ярче при наведении */
        }

        .logo span {
            color: var(--accent);
            font-weight: 700;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: var(--text-main);
        }

        .lang-switcher {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 3px;
        }

        .lang-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lang-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 0 10px rgba(157, 78, 221, 0.4);
        }

        /* Hero / Welcome Section */
        .hero {
            padding: 180px 20px 80px;
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(157, 78, 221, 0.1);
            border: 1px solid rgba(157, 78, 221, 0.3);
            border-radius: 50px;
            font-size: 0.82rem;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 25px;
            box-shadow: 0 0 20px rgba(157, 78, 221, 0.15);
        }

        .hero h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: -0.03em;
            line-height: 1.15;
            background: linear-gradient(135deg, #ffffff 20%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero h1 span {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-desc {
            font-size: 1.15rem;
            color: var(--text-muted);
            line-height: 1.7;
            margin-bottom: 30px;
        }

        /* Features / About Cards */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto 80px;
            padding: 0 20px;
            text-align: left;
        }

        .feature-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px;
        }

        .feature-card h4 {
            font-size: 1.05rem;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .feature-card p {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* Section Title */
        .section-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 40px;
        }

        /* Downloads Grid */
        .downloads-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1000px;
            margin: 0 auto 100px;
            padding: 0 20px;
        }

        .download-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 35px;
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .download-card:hover {
            transform: translateY(-6px);
            border-color: var(--border-glow);
            background: var(--surface-hover);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 30px var(--primary-glow);
        }

        .card-top h3 {
            font-size: 1.3rem;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .card-top p {
            font-size: 0.92rem;
            color: var(--text-muted);
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--primary), #7b2cbf);
            color: white;
            padding: 14px 20px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(157, 78, 221, 0.3);
        }

        .download-btn:hover {
            background: linear-gradient(135deg, var(--accent), var(--primary));
            box-shadow: 0 6px 25px rgba(157, 78, 221, 0.5);
        }

        .download-btn.disabled {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-muted);
            box-shadow: none;
            pointer-events: none;
            border: 1px solid var(--border);
        }

        /* Gallery Section */
        .gallery {
            max-width: 1100px;
            margin: 0 auto 100px;
            padding: 0 20px;
            text-align: center;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        .gallery-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            border-color: var(--border-glow);
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* Footer */
        footer {
            border-top: 1px solid var(--border);
            padding: 40px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            background: rgba(7, 8, 10, 0.8);
        }

        @media (max-width: 768px) {
            header { width: 95%; padding: 0 15px; }
            .hero { padding-top: 140px; }
            .logo { gap: 8px; } /* Чуть меньше отступ на мобильных */
            .logo svg { height: 1.2rem; } /* Чуть меньше иконка на мобильных */
        }
    </style>
</head>
